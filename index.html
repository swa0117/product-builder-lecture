<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Lotto Generator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="theme-switch-wrapper">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark/light mode">
          <span class="mode-icon">🌙</span>
        </button>
      </div>
      <h1>LOTTO <span>GENERATOR</span></h1>
      <p>당신의 행운을 확인해보세요</p>
    </header>

    <main id="main-content">
      <div id="ball-container" class="ball-container">
        <!-- Lotto balls will be injected here -->
        <div class="placeholder">행운의 번호를 생성하려면 아래 버튼을 누르세요</div>
      </div>

      <div class="controls">
        <button id="generate-btn" class="glow-button">번호 생성하기</button>
      </div>
    </main>

    <section class="history-section">
      <h2>최근 번호 내역</h2>
      <ul id="history-list"></ul>
    </section>

    <section class="contact-section">
      <h2>제휴 및 서비스 문의</h2>
      <form action="https://formspree.io/f/mqaklowe" method="POST" class="contact-form">
        <div class="form-group">
          <input type="text" name="name" placeholder="성함/기업명" required>
        </div>
        <div class="form-group">
          <input type="email" name="email" placeholder="이메일 주소" required>
        </div>
        <div class="form-group">
          <textarea name="message" placeholder="문의 내용을 입력해주세요" required></textarea>
        </div>
        <button type="submit" class="glow-button submit-btn">문의 보내기</button>
      </form>
    </section>
  </div>

  <div class="noise-overlay"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
